version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bonga-shop-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bonga_shop}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bonga_shop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-bonga_shop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bonga-shop-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bonga_shop}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-for-bonga-shop-please-2026}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-true}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Bonga Admin}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@bonga.shop}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin123!}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  bonga_shop_postgres_data:
