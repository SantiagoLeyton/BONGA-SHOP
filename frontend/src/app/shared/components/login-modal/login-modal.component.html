<app-modal-shell [isOpen]="isOpen()" title="Iniciar sesion" (closed)="close()">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="intro">
      <p class="intro-title">Accede a tu cuenta</p>
      <p class="intro-copy">Guarda favoritos, recupera tu carrito y revisa tus pedidos en un solo lugar.</p>
    </div>

    <label class="field">
      <span>Correo</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)"
      />
      @if (form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)) {
        <span class="err">Ingresa un correo valido.</span>
      }
    </label>

    <label class="field">
      <span>Contrasena</span>
      <div class="pw">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [attr.aria-invalid]="
            form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)
          "
        />
        <button type="button" class="pw-btn" (click)="togglePassword()">
          {{ showPassword() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
      @if (form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)) {
        <span class="err">Minimo 8 caracteres.</span>
      }
    </label>

    <div class="row">
      <label class="check">
        <input type="checkbox" formControlName="remember" />
        <span>Mantener sesion abierta</span>
      </label>
      <button type="button" class="linkish" (click)="forgotPassword()">Necesitas ayuda?</button>
    </div>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
      @if (loading()) {
        Entrando...
      } @else {
        Entrar a mi cuenta
      }
    </button>

    <p class="hint">Tu sesion te permite guardar favoritos, mantener tu carrito y finalizar compras protegidas.</p>
    <p class="switch">
      Aun no tienes cuenta?
      <button type="button" class="linkish" (click)="openRegister()">Crear cuenta</button>
    </p>
  </form>
</app-modal-shell>
