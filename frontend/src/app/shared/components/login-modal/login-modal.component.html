<app-modal-shell
  [isOpen]="isOpen()"
  title="Iniciar sesion"
  (closed)="close()"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Correo</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)"
      />
      @if (form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)) {
        <span class="err">Ingresa un correo valido.</span>
      }
    </label>
    <label class="field">
      <span>Contrasena</span>
      <div class="pw">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [attr.aria-invalid]="
            form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)
          "
        />
        <button type="button" class="pw-btn" (click)="togglePassword()">
          {{ showPassword() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
      @if (form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)) {
        <span class="err">Minimo 8 caracteres.</span>
      }
    </label>
    <div class="row">
      <label class="check">
        <input type="checkbox" formControlName="remember" />
        <span>Recordarme</span>
      </label>
      <button type="button" class="linkish" (click)="forgotPassword()">Olvidaste tu contrasena?</button>
    </div>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
      @if (loading()) {
        Continuando...
      } @else {
        Continuar
      }
    </button>
    <p class="hint">Tu sesion se autentica contra el backend y conserva el token para las rutas protegidas.</p>
    <p class="switch">
      No tienes cuenta?
      <button type="button" class="linkish" (click)="openRegister()">Crear cuenta</button>
    </p>
  </form>
</app-modal-shell>
