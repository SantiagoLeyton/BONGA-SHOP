<app-modal-shell
  [isOpen]="isOpen()"
  title="Iniciar sesión"
  (closed)="close()"
>
  <form class="auth-form" (submit)="$event.preventDefault()">
    <label class="field">
      <span>Correo</span>
      <input type="email" name="email" autocomplete="username" placeholder="tu@correo.com" />
    </label>
    <label class="field">
      <span>Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" />
    </label>
    <button type="button" class="btn btn-primary" disabled>Continuar</button>
    <p class="hint">La autenticación real se integrará con el backend (JWT).</p>
    <p class="switch">
      ¿No tienes cuenta?
      <button type="button" class="linkish" (click)="openRegister()">Crear cuenta</button>
    </p>
  </form>
</app-modal-shell>
