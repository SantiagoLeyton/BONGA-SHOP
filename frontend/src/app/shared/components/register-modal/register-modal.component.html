<app-modal-shell
  [isOpen]="isOpen()"
  title="Crear cuenta"
  (closed)="close()"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Nombre</span>
      <input
        type="text"
        formControlName="name"
        autocomplete="name"
        placeholder="Tu nombre"
        [attr.aria-invalid]="form.controls.name.invalid && (form.controls.name.touched || form.controls.name.dirty)"
      />
      @if (form.controls.name.invalid && (form.controls.name.touched || form.controls.name.dirty)) {
        <span class="err">Tu nombre debe tener al menos 2 caracteres.</span>
      }
    </label>
    <label class="field">
      <span>Correo</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        [attr.aria-invalid]="form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)"
      />
      @if (form.controls.email.invalid && (form.controls.email.touched || form.controls.email.dirty)) {
        <span class="err">Ingresa un correo valido.</span>
      }
    </label>
    <label class="field">
      <span>Contrasena</span>
      <div class="pw">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Minimo 8 caracteres"
          [attr.aria-invalid]="
            form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)
          "
        />
        <button type="button" class="pw-btn" (click)="togglePassword()">
          {{ showPassword() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
      <div class="meter" [attr.data-s]="strength()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <p class="meter-hint">
        @switch (strength()) {
          @case (0) { Debil }
          @case (1) { Debil }
          @case (2) { OK }
          @case (3) { Fuerte }
          @default { Muy fuerte }
        }
      </p>
      @if (form.controls.password.invalid && (form.controls.password.touched || form.controls.password.dirty)) {
        <span class="err">Minimo 8 caracteres.</span>
      }
    </label>
    <label class="check">
      <input type="checkbox" formControlName="accept" />
      <span>Acepto los terminos y condiciones.</span>
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
      @if (loading()) {
        Creando cuenta...
      } @else {
        Registrarme
      }
    </button>
    <p class="hint">El registro crea la cuenta en backend y deja la sesion iniciada automaticamente.</p>
    <p class="switch">
      Ya tienes cuenta?
      <button type="button" class="linkish" (click)="openLogin()">Iniciar sesion</button>
    </p>
  </form>
</app-modal-shell>
