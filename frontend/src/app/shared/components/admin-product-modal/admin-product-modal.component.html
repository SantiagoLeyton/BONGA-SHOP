<app-modal-shell [isOpen]="isOpen" [title]="product ? 'Editar producto' : 'Nuevo producto'" (closed)="close()">
  <form class="form" [formGroup]="form" (ngSubmit)="save()">
    <div class="grid">
      <label class="field">
        <span>Nombre</span>
        <input formControlName="name" placeholder="Nombre del producto" />
      </label>

      <label class="field">
        <span>Marca</span>
        <select formControlName="brandId">
          <option value="" disabled>Selecciona una marca</option>
          @for (brand of brands; track brand.id) {
            <option [value]="brand.id">{{ brand.name }}</option>
          }
        </select>
      </label>

      <label class="field field--wide">
        <span>Descripcion</span>
        <textarea formControlName="description" rows="3" placeholder="Descripcion del producto..."></textarea>
      </label>

      <label class="check field--wide">
        <input type="checkbox" formControlName="active" />
        <span>Producto activo</span>
      </label>
    </div>

    <section class="variants-card">
      <div class="variants-head">
        <div>
          <p class="muted small">Variantes</p>
          <h3>Sabores y niveles de nicotina</h3>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" (click)="addVariant()">Agregar variante</button>
      </div>

      <div class="variants-list" formArrayName="variants">
        @for (variant of variants.controls; track trackVariant($index, variant); let i = $index) {
          <div class="variant-row" [formGroup]="variant">
            <input type="hidden" formControlName="id" />
            <label class="field">
              <span>Sabor</span>
              <input formControlName="flavor" placeholder="Menta" />
            </label>
            <label class="field">
              <span>Nicotina (mg)</span>
              <input type="number" min="0" formControlName="nicotineMg" />
            </label>
            <label class="field">
              <span>Precio</span>
              <input type="number" min="0.01" step="0.01" formControlName="price" />
            </label>
            <label class="field">
              <span>Stock</span>
              <input type="number" min="0" step="1" formControlName="stock" />
            </label>
            <label class="check">
              <input type="checkbox" formControlName="active" />
              <span>Activa</span>
            </label>
            <button type="button" class="btn btn-text btn-sm" (click)="removeVariant(i)">Eliminar</button>
          </div>
        }
      </div>
    </section>

    <div class="preview">
      <p class="muted small">Resumen</p>
      <div class="summary-grid">
        <p><strong>Marca:</strong> {{ selectedBrandName() }}</p>
        <p><strong>Variantes:</strong> {{ variants.length }}</p>
        <p><strong>Estado:</strong> {{ form.controls.active.value ? 'Activo' : 'Inactivo' }}</p>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-ghost" (click)="close()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || !brands.length || !variants.length">
        Guardar
      </button>
    </div>
  </form>
</app-modal-shell>
