<div class="filters">
  <div class="filters-head">
    <h2 class="h">Filtros</h2>
    <button type="button" class="btn btn-text btn-sm" (click)="reset()">Limpiar</button>
  </div>

  <section class="block">
    <h3 class="sub">Orden</h3>
    <label class="select-wrap">
      <span class="sr-only">Ordenar por</span>
      <select
        class="select"
        [value]="value.sort"
        (change)="updateSort($any($event.target).value)"
      >
        <option value="featured">Destacados</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="name">Nombre (A–Z)</option>
      </select>
    </label>
  </section>

  <section class="block">
    <h3 class="sub">Marca</h3>
    <ul class="checks">
      @for (b of brands; track b.id) {
        <li>
          <label class="check">
            <input
              type="checkbox"
              [checked]="brandChecked(b.slug)"
              (change)="toggleBrand(b.slug, $any($event.target).checked)"
            />
            <span>{{ b.name }}</span>
          </label>
        </li>
      }
    </ul>
  </section>

  <section class="block">
    <h3 class="sub">Sabor</h3>
    <ul class="checks">
      @for (f of flavors; track f) {
        <li>
          <label class="check">
            <input
              type="checkbox"
              [checked]="flavorChecked(f)"
              (change)="toggleFlavor(f, $any($event.target).checked)"
            />
            <span>{{ f }}</span>
          </label>
        </li>
      }
    </ul>
  </section>

  <section class="block">
    <h3 class="sub">Nicotina (mg)</h3>
    <div class="grid2">
      <label class="mini">
        <span>Mín</span>
        <input
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="—"
          [value]="value.nicotineMin ?? ''"
          (input)="updateNicotineMin($any($event.target).value)"
        />
      </label>
      <label class="mini">
        <span>Máx</span>
        <input
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="—"
          [value]="value.nicotineMax ?? ''"
          (input)="updateNicotineMax($any($event.target).value)"
        />
      </label>
    </div>
  </section>

  <section class="block">
    <h3 class="sub">Precio (€)</h3>
    <div class="grid2">
      <label class="mini">
        <span>Mín</span>
        <input
          type="number"
          inputmode="decimal"
          min="0"
          step="0.5"
          placeholder="—"
          [value]="value.priceMin ?? ''"
          (input)="updatePriceMin($any($event.target).value)"
        />
      </label>
      <label class="mini">
        <span>Máx</span>
        <input
          type="number"
          inputmode="decimal"
          min="0"
          step="0.5"
          placeholder="—"
          [value]="value.priceMax ?? ''"
          (input)="updatePriceMax($any($event.target).value)"
        />
      </label>
    </div>
  </section>
</div>
