<section
  class="vapor-scrub"
  [class.vapor-scrub--static]="useStaticReduced()"
  [ngStyle]="
    useStaticReduced()
      ? { minHeight: '58vh' }
      : { height: scrollVh() + 'vh' }
  "
  aria-label="Animación de producto controlada por scroll"
>
  <div class="vapor-scrub__sticky">
    <p class="vapor-scrub__hint">
      @if (useStaticReduced()) {
        Vista estática (movimiento reducido activado)
      } @else {
        Desplaza hacia abajo · secuencia 3D
      }
    </p>

    <div class="vapor-scrub__stage">
      <div class="vapor-scrub__device">
        <img
          [src]="broken() ? fallbackSrc() : imageUrl()"
          width="640"
          height="640"
          alt=""
          draggable="false"
          decoding="async"
          (error)="onImgError()"
        />
      </div>
    </div>

    @if (!useStaticReduced()) {
      <div class="vapor-scrub__rail" aria-hidden="true">
        <span class="vapor-scrub__rail-fill" [style.transform]="'scaleX(' + progress() + ')'"></span>
      </div>
    }
  </div>
</section>
