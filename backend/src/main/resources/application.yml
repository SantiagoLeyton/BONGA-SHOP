spring:
  application:
    name: bonga-shop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bonga_shop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-for-bonga-shop-please-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  bootstrap:
    admin-enabled: ${APP_ADMIN_ENABLED:true}
    admin-name: ${APP_ADMIN_NAME:Bonga Admin}
    admin-email: ${APP_ADMIN_EMAIL:admin@bonga.shop}
    admin-password: ${APP_ADMIN_PASSWORD:Admin123!}
